<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(pageTitle, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|${pageTitle} - Scam Flagger|">Scam Flagger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/style.css}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">Scam Flagger</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3" th:if="${loggedIn}"
                      th:text="|Welcome, ${currentUsername}!|"></span>
                <a class="nav-link" th:if="${loggedIn}" th:href="@{/check}">Check Website</a>
                <a class="nav-link" th:if="${loggedIn}" th:href="@{/logout}">Logout</a>
                <a class="nav-link" th:unless="${loggedIn}" th:href="@{/login}">Login</a>
                <a class="nav-link" th:unless="${loggedIn}" th:href="@{/register}">Register</a>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <div th:if="${flashMessage}" th:class="|alert alert-${flashCategory} alert-dismissible fade show|"
             role="alert">
            <span th:text="${flashMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <main th:replace="${content}"></main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
